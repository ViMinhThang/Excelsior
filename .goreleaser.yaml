version: 2
project_name: excelsior
builds:
  - id: excelsior
    main: ./cmd/excelsior
    binary: excelsior
    ldflags: -s -w -X main.version={{.Version}}
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
archives:
  - id: dist
    builds: [excelsior]
    name_template: "{{.ProjectName}}_{{.Version}}_{{.Os}}_{{.Arch}}"
checksum:
  name_template: checksums.txt
changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
