# @file .github/workflows/ai-review.yml
# @description GitHub Action workflow configuration.
# @why To automatically trigger the AI review agent when a pull request is opened or updated.
# @how Listens for pull_request events on the repository and runs the compiled src/action.ts using Node.js.
# @input GitHub Pull Request event payload (diff, PR number, repo info).
# @output A unified comment posted to the Pull Request.

name: AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Dependencies
        run: npm ci
      - name: Build Action
        run: npm run build
      - name: Run AI Review
        run: node dist/action.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
