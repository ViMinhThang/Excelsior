<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cosmos</title>
<style>
  /* ── reset & base ── */
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; background:#0a0a0f; color:#fff; }

  /* ── three.js canvas ── */
  #bg { position:fixed; inset:0; z-index:0; display:block; }

  /* ── overlay content ── */
  .overlay {
    position:fixed; inset:0; z-index:10;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center;
    pointer-events:none;
    user-select:none;
  }

  .overlay h1 {
    font-size:clamp(3rem,12vw,8rem); font-weight:800;
    letter-spacing:-0.03em;
    background:linear-gradient(135deg,#f0e6ff 0%,#a78bfa 40%,#7c3aed 70%,#c084fc 100%);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
    background-clip:text;
    filter:drop-shadow(0 0 60px rgba(124,58,237,.25));
    animation:floatIn 1.6s cubic-bezier(.22,1,.36,1) forwards;
    opacity:0; transform:translateY(40px) scale(.96);
  }

  .overlay p {
    margin-top:1.2rem;
    font-size:clamp(1rem,2.5vw,1.6rem); font-weight:300;
    letter-spacing:0.06em;
    color:rgba(255,255,255,.65);
    animation:floatIn 1.6s .25s cubic-bezier(.22,1,.36,1) forwards;
    opacity:0; transform:translateY(30px);
  }

  .overlay .badge {
    margin-top:2.8rem;
    display:inline-flex; gap:.6rem; align-items:center;
    padding:.7rem 1.8rem;
    border:1px solid rgba(255,255,255,.12);
    border-radius:100px;
    background:rgba(255,255,255,.04);
    backdrop-filter:blur(12px);
    font-size:.85rem; font-weight:500; letter-spacing:.04em;
    color:rgba(255,255,255,.7);
    animation:floatIn 1.6s .5s cubic-bezier(.22,1,.36,1) forwards;
    opacity:0; transform:translateY(20px);
    pointer-events:auto; cursor:default;
    transition:border-color .3s,background .3s;
  }
  .overlay .badge:hover {
    border-color:rgba(124,58,237,.4);
    background:rgba(124,58,237,.08);
  }
  .badge-dot {
    width:8px;height:8px;border-radius:50%;
    background:#7c3aed;
    animation:pulse-dot 2s ease-in-out infinite;
  }

  .scroll-hint {
    position:fixed; bottom:2.5rem; left:50%; transform:translateX(-50%);
    z-index:10;
    display:flex; flex-direction:column; align-items:center; gap:.4rem;
    color:rgba(255,255,255,.25);
    font-size:.7rem; letter-spacing:.15em; text-transform:uppercase;
    animation:floatIn 1.6s .8s cubic-bezier(.22,1,.36,1) forwards;
    opacity:0;
  }
  .scroll-hint .mouse {
    width:22px;height:34px;border-radius:12px;
    border:2px solid rgba(255,255,255,.2);
    display:flex;justify-content:center;padding-top:6px;
  }
  .scroll-hint .mouse::after {
    content:'';display:block;width:2px;height:7px;border-radius:2px;
    background:rgba(255,255,255,.35);
    animation:scrollWheel 1.8s ease-in-out infinite;
  }

  /* ── keyframes ── */
  @keyframes floatIn {
    to { opacity:1; transform:translateY(0) scale(1); }
  }
  @keyframes pulse-dot {
    0%,100% { opacity:.4; transform:scale(1); }
    50% { opacity:1; transform:scale(1.3); }
  }
  @keyframes scrollWheel {
    0% { opacity:1; transform:translateY(0); }
    100% { opacity:0; transform:translateY(10px); }
  }

  /* ── responsive fine-tune ── */
  @media (max-width:640px) {
    .overlay p br { display:none; }
  }
</style>
</head>
<body>

<canvas id="bg"></canvas>

<div class="overlay">
  <h1>Explore the&nbsp;Cosmos</h1>
  <p>A tiny glimpse into an infinite universe.<br/>Built with Three.js &mdash; pure browser magic.</p>
  <div class="badge">
    <span class="badge-dot"></span>
    Interactive 3D Particle System &mdash; 16k stars
  </div>
</div>

<div class="scroll-hint">
  <div class="mouse"></div>
  <span>breathe</span>
</div>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"
  }
}
</script>

<script type="module">
import * as THREE from 'three';

// ─── setup ───
const canvas = document.getElementById('bg');
const renderer = new THREE.WebGLRenderer({ canvas, alpha:true, antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 2000);
camera.position.set(0, 0, 360);

// ─── stars ───
const STAR_COUNT = 16000;
const positions = new Float32Array(STAR_COUNT * 3);
const colors = new Float32Array(STAR_COUNT * 3);
const sizes = new Float32Array(STAR_COUNT);

const colorPalette = [
  new THREE.Color(0xa78bfa), // violet
  new THREE.Color(0x7c3aed), // deep purple
  new THREE.Color(0xc084fc), // light purple
  new THREE.Color(0x60a5fa), // blue
  new THREE.Color(0xf472b6), // pink
  new THREE.Color(0xfbbf24), // gold
];

for (let i = 0; i < STAR_COUNT; i++) {
  const radius = 80 + Math.random() * 250;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);

  // sphere distribution with some randomness
  const r = radius * (0.6 + Math.random() * 0.4);
  positions[i*3]   = r * Math.sin(phi) * Math.cos(theta);
  positions[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i*3+2] = r * Math.cos(phi);

  const col = colorPalette[Math.floor(Math.random() * colorPalette.length)].clone();
  const bright = 0.4 + Math.random() * 0.6;
  colors[i*3]   = col.r * bright;
  colors[i*3+1] = col.g * bright;
  colors[i*3+2] = col.b * bright;

  sizes[i] = 0.4 + Math.random() * 1.8;
}

const geometry = new THREE.BufferGeometry();
geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

// custom sprite shader for round, glowing points
const vertexShader = `
  attribute float size;
  varying vec3 vColor;
  void main() {
    vColor = color;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    gl_PointSize = size * (320.0 / -mvPosition.z);
    gl_Position = projectionMatrix * mvPosition;
  }
`;
const fragmentShader = `
  varying vec3 vColor;
  void main() {
    float d = distance(gl_PointCoord, vec2(0.5));
    if (d > 0.5) discard;
    float glow = 1.0 - smoothstep(0.0, 0.5, d);
    float core = 1.0 - smoothstep(0.0, 0.15, d);
    gl_FragColor = vec4(vColor, glow * 0.85 + core * 0.4);
  }
`;

const material = new THREE.ShaderMaterial({
  uniforms: {},
  vertexShader,
  fragmentShader,
  transparent: true,
  depthWrite: false,
  blending: THREE.AdditiveBlending,
  vertexColors: true,
});

const stars = new THREE.Points(geometry, material);
scene.add(stars);

// ─── nebula glow (large transparent sprites) ───
function makeNebulaSprite(color, pos, size) {
  const map = (() => {
    const c = document.createElement('canvas');
    c.width = 128; c.height = 128;
    const ctx = c.getContext('2d');
    const g = ctx.createRadialGradient(64,64,0, 64,64,64);
    g.addColorStop(0, 'rgba(255,255,255,0.15)');
    g.addColorStop(0.3, `rgba(${color.join(',')},0.08)`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.fillRect(0,0,128,128);
    return new THREE.CanvasTexture(c);
  })();
  const mat = new THREE.SpriteMaterial({ map, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false });
  const sprite = new THREE.Sprite(mat);
  sprite.position.set(pos[0], pos[1], pos[2]);
  sprite.scale.set(size, size, 1);
  return sprite;
}

scene.add(makeNebulaSprite([167,139,250],  [-140, 80,-120], 240));
scene.add(makeNebulaSprite([124,58,237],   [ 160,-60,-180], 280));
scene.add(makeNebulaSprite([96,165,250],   [ -80,-140,-80], 200));
scene.add(makeNebulaSprite([244,114,182],  [ 100,160, 100], 220));

// ─── subtle central glow ───
const glowGeo = new THREE.SphereGeometry(12, 32, 32);
const glowMat = new THREE.MeshBasicMaterial({ color:0x7c3aed, transparent:true, opacity:0.12 });
const glowMesh = new THREE.Mesh(glowGeo, glowMat);
scene.add(glowMesh);

const glowGeo2 = new THREE.SphereGeometry(6, 32, 32);
const glowMat2 = new THREE.MeshBasicMaterial({ color:0xc084fc, transparent:true, opacity:0.2 });
const glowMesh2 = new THREE.Mesh(glowGeo2, glowMat2);
scene.add(glowMesh2);

// ─── mouse tracking ───
let mouseX = 0, mouseY = 0;
let targetRotX = 0, targetRotY = 0;

document.addEventListener('mousemove', (e) => {
  mouseX = (e.clientX / window.innerWidth) * 2 - 1;
  mouseY = (e.clientY / window.innerHeight) * 2 - 1;
});

// ─── resize ───
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ─── animate ───
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const t = clock.getElapsedTime();

  // smooth mouse follow
  targetRotX += (mouseY * 0.3 - targetRotX) * 0.03;
  targetRotY += (mouseX * 0.3 - targetRotY) * 0.03;

  stars.rotation.x = targetRotX + t * 0.015;
  stars.rotation.y = targetRotY + t * 0.02;

  // subtle camera drift
  camera.position.x = Math.sin(t * 0.025) * 12 + targetRotY * 8;
  camera.position.y = Math.sin(t * 0.018) * 8 + targetRotX * 8;
  camera.lookAt(0, 0, 0);

  // pulse central glow
  const pulse = 1 + Math.sin(t * 0.8) * 0.15;
  glowMesh.scale.set(pulse, pulse, pulse);
  glowMat.opacity = 0.08 + Math.sin(t * 0.8) * 0.04;
  glowMesh2.scale.set(1 + Math.sin(t * 1.2) * 0.2, 1 + Math.sin(t * 1.2) * 0.2, 1 + Math.sin(t * 1.2) * 0.2);

  renderer.render(scene, camera);
}

animate();
</script>
</body>
</html>
